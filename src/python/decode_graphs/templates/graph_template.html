<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Codebase Dependency Graph</title>

<!-- Vis.js Network -->
<script src="../../lib/vis-9.1.2/vis-network.min.js"></script>
<link href="../../lib/vis-9.1.2/vis-network.css" rel="stylesheet" type="text/css" />

<style>
  :root{
    --bg-0:#0a0e14;
    --bg-1:#0d1117;
    --panel-bg: rgba(22, 27, 38, 0.55);
    --panel-border: rgba(255,255,255,0.08);
    --accent: #61dafb;
    --accent-2: #a78bfa;
    --accent-3: #34d399;
    --text-hi: #e6edf3;
    --text-lo: #8b949e;
    --danger: #f87171;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background: radial-gradient(circle at 20% 20%, #111827 0%, var(--bg-0) 45%, var(--bg-1) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-hi);
  }

  #mynetwork{
    position: fixed;
    top:0; left:0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    touch-action: none;
  }

  /* ---------- Top Toolbar ---------- */
  .toolbar{
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  .brand{
    pointer-events: auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 16px;
    border-radius: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .brand .dot{
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent);
  }

  .toolbar-actions{
    pointer-events: auto;
    display:flex;
    gap: 8px;
  }

  .tbtn{
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    color: var(--text-hi);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    transition: all .18s ease;
  }
  .tbtn:hover{
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(97,218,251,0.25);
    transform: translateY(-1px);
  }
  .tbtn:active{ transform: translateY(0); }
  .tbtn.active{
    border-color: var(--accent-3);
    box-shadow: 0 0 0 1px var(--accent-3), 0 0 16px rgba(52,211,153,0.35);
  }

  /* ---------- Search ---------- */
  .search-wrap{
    position: fixed;
    top: 70px;
    left: 16px;
    z-index: 20;
    pointer-events: auto;
  }
  #searchInput{
    width: 240px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    color: var(--text-hi);
    font-size: 13px;
    outline: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    transition: box-shadow .2s ease, width .2s ease;
  }
  #searchInput::placeholder{ color: var(--text-lo); }
  #searchInput:focus{
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(97,218,251,0.25);
    width: 280px;
  }

  /* ---------- Info / Detail Panel (Glassmorphism) ---------- */
  #infoPanel{
    position: fixed;
    z-index: 30;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px 22px;
    transition: transform .35s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    opacity: 0;
    pointer-events: none;
  }

  /* Desktop: right-side floating card */
  @media (min-width: 761px){
    #infoPanel{
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 340px;
      transform: translateX(360px);
      display:flex;
      flex-direction: column;
    }
    #infoPanel.open{
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
  }

  /* Mobile: bottom sheet */
  @media (max-width: 760px){
    #infoPanel{
      left: 10px;
      right: 10px;
      bottom: 10px;
      max-height: 55vh;
      transform: translateY(120%);
      border-radius: 20px;
    }
    #infoPanel.open{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .search-wrap{ top: auto; bottom: 16px; left: 50%; transform: translateX(-50%); }
    #searchInput{ width: 70vw; }
    #searchInput:focus{ width: 78vw; }
  }

  .panel-header{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
    flex-shrink: 0;
  }

  .panel-title{
    font-size: 17px;
    font-weight: 700;
    color: var(--text-hi);
    word-break: break-word;
    line-height: 1.3;
  }

  .panel-close{
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    color: var(--text-lo);
    width: 28px; height: 28px;
    min-width: 28px;
    border-radius: 8px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
    line-height: 1;
    transition: all .15s ease;
  }
  .panel-close:hover{ color: var(--danger); border-color: var(--danger); }

  .panel-body{
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  .panel-body::-webkit-scrollbar{ width: 6px; }
  .panel-body::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius: 10px; }

  .field-label{
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 16px;
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field-label:first-child{ margin-top: 0; }
  .field-label::before{
    content:'';
    width: 6px; height: 6px;
    border-radius: 2px;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  .field-value{
    font-size: 13px;
    color: var(--text-hi);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    word-break: break-word;
    white-space: pre-wrap;
    line-height: 1.55;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  .field-value.id-value{ color: var(--accent-2); font-weight: 600; }

  .badge-row{ display:flex; gap:6px; flex-wrap: wrap; margin-top: 4px; }
  .badge{
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(97,218,251,0.12);
    border: 1px solid rgba(97,218,251,0.35);
    color: var(--accent);
    font-weight: 600;
  }

  .placeholder-hint{
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 15;
    color: var(--text-lo);
    font-size: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    padding: 8px 14px;
    border-radius: 10px;
    pointer-events: none;
    animation: fadeOutHint 6s forwards;
  }
  @keyframes fadeOutHint{
    0%, 70%{ opacity: 1; }
    100%{ opacity: 0; visibility: hidden; }
  }

  /* Loading overlay */
  #loadingOverlay{
    position: fixed; inset:0; z-index: 50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: var(--bg-1);
    transition: opacity .4s ease, visibility .4s ease;
  }
  .spinner{
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #loadingOverlay p{ color: var(--text-lo); font-size: 13px; letter-spacing: 0.5px; }

  @media (max-width: 760px){
    .toolbar{ top: 12px; left: 12px; right: 12px; }
    .brand span.label{ display:none; }
  }
</style>
</head>

<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>RENDERING DEPENDENCY GRAPH…</p>
</div>

<div class="toolbar">
  <div class="brand">
    <span class="dot"></span>
    <span class="label">Dependency Graph</span>
  </div>
  <div class="toolbar-actions">
    <div class="tbtn" id="physicsToggle" title="Toggle physics simulation">⚛ Physics</div>
    <div class="tbtn" id="fitBtn" title="Fit graph to screen">⤢ Fit</div>
  </div>
</div>

<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="🔍 Search node / module…" autocomplete="off" />
</div>

<div id="mynetwork"></div>

<div id="infoPanel">
  <div class="panel-header">
    <div class="panel-title" id="panelTitle">Node</div>
    <div class="panel-close" id="panelClose">✕</div>
  </div>
  <div class="panel-body">
    <div class="field-label">ID</div>
    <div class="field-value id-value" id="panelId">—</div>

    <div class="field-label">Label</div>
    <div class="field-value" id="panelLabel">—</div>

    <div class="field-label">Details / Docstring</div>
    <div class="field-value" id="panelDetails">—</div>

    <div class="field-label">Connections</div>
    <div class="badge-row" id="panelConnections"></div>
  </div>
</div>

<div class="placeholder-hint">💡 Click any node to inspect it · Drag to pan · Scroll to zoom</div>

<script type="text/javascript">
  // -----------------------------------------------------------------
  // DATA INJECTED BY PYVIS (do not remove — required Jinja2 hooks)
  // -----------------------------------------------------------------
  var nodes = new vis.DataSet({{ nodes|safe }});
  var edges = new vis.DataSet({{ edges|safe }});

  var container = document.getElementById('mynetwork');
  var data = { nodes: nodes, edges: edges };

  // -----------------------------------------------------------------
  // VIS.JS OPTIONS — dark theme, smooth physics, glow-on-hover
  // -----------------------------------------------------------------
  var options = {
    autoResize: true,
    height: '100%',
    width: '100%',
    layout: {
      improvedLayout: true,
      randomSeed: 42
    },
    nodes: {
      shape: 'dot',
      size: 16,
      borderWidth: 2,
      borderWidthSelected: 4,
      font: {
        color: '#e6edf3',
        size: 14,
        face: 'Inter, sans-serif',
        strokeWidth: 0,
        vadjust: -2
      },
      color: {
        background: '#61dafb',
        border: '#2c9fc9',
        highlight: { background: '#a78bfa', border: '#7c5cf2' },
        hover: { background: '#7ee3ff', border: '#61dafb' }
      },
      shadow: {
        enabled: true,
        color: 'rgba(97,218,251,0.35)',
        size: 15,
        x: 0,
        y: 0
      },
      scaling: {
        min: 10,
        max: 34
      }
    },
    edges: {
      width: 1.4,
      color: {
        color: 'rgba(139,148,158,0.55)',
        highlight: '#a78bfa',
        hover: '#61dafb',
        opacity: 0.8
      },
      smooth: {
        enabled: true,
        type: 'continuous',
        roundness: 0.55
      },
      arrows: {
        to: { enabled: true, scaleFactor: 0.55, type: 'arrow' }
      },
      shadow: {
        enabled: false
      },
      selectionWidth: 2,
      hoverWidth: 1.6
    },
    interaction: {
      hover: true,
      tooltipDelay: 120,
      hideEdgesOnDrag: true,
      hideEdgesOnZoom: true,
      navigationButtons: false,
      keyboard: { enabled: true, bindToWindow: false },
      multiselect: true,
      zoomView: true,
      dragView: true
    },
    physics: {
      enabled: true,
      solver: 'barnesHut',
      barnesHut: {
        gravitationalConstant: -18000,
        centralGravity: 0.35,
        springLength: 140,
        springConstant: 0.045,
        damping: 0.4,
        avoidOverlap: 0.6
      },
      stabilization: {
        enabled: true,
        iterations: 250,
        updateInterval: 25
      }
    },
    groups: {
      file: {
        shape: 'box',
        color: {
          background: 'rgba(21, 27, 38, 0.85)',
          border: '#3b82f6',
          highlight: { background: 'rgba(59, 130, 246, 0.25)', border: '#60a5fa' },
          hover: { background: 'rgba(59, 130, 246, 0.35)', border: '#3b82f6' }
        },
        font: { face: 'monospace', size: 14, color: '#f8fafc' },
        borderWidth: 2,
        margin: 10
      },
      class: {
        shape: 'box',
        color: {
          background: 'rgba(21, 27, 38, 0.85)',
          border: '#10b981',
          highlight: { background: 'rgba(16, 185, 129, 0.25)', border: '#34d399' },
          hover: { background: 'rgba(16, 185, 129, 0.35)', border: '#10b981' }
        },
        font: { face: 'monospace', size: 14, color: '#f8fafc' },
        borderWidth: 2,
        margin: 10
      },
      symbol: {
        shape: 'box',
        color: {
          background: 'rgba(21, 27, 38, 0.85)',
          border: '#8b5cf6',
          highlight: { background: 'rgba(139, 92, 246, 0.25)', border: '#a78bfa' },
          hover: { background: 'rgba(139, 92, 246, 0.35)', border: '#8b5cf6' }
        },
        font: { face: 'monospace', size: 14, color: '#f8fafc' },
        borderWidth: 2,
        margin: 10
      },
      entry: {
        shape: 'box',
        color: {
          background: 'rgba(239, 68, 68, 0.25)',
          border: '#ef4444',
          highlight: { background: 'rgba(239, 68, 68, 0.35)', border: '#f87171' },
          hover: { background: 'rgba(239, 68, 68, 0.45)', border: '#ef4444' }
        },
        font: { face: 'monospace', size: 16, color: '#f8fafc' },
        borderWidth: 3,
        margin: 12
      },
      external: {
        shape: 'dot',
        size: 10,
        color: {
          background: '#475569',
          border: '#64748b',
          highlight: { background: '#64748b', border: '#94a3b8' },
          hover: { background: '#64748b', border: '#64748b' }
        },
        font: { size: 11, color: '#94a3b8' }
      }
    }
  };

  var network = new vis.Network(container, data, options);

  // -----------------------------------------------------------------
  // LOADING OVERLAY — hide once physics stabilizes
  // -----------------------------------------------------------------
  network.once('stabilizationIterationsDone', function () {
    finishLoading();
  });
  // Fallback in case graph is tiny / physics disabled and event never fires
  setTimeout(finishLoading, 3000);

  var loadingDone = false;
  function finishLoading(){
    if (loadingDone) return;
    loadingDone = true;
    var overlay = document.getElementById('loadingOverlay');
    overlay.style.opacity = '0';
    overlay.style.visibility = 'hidden';
    setTimeout(function(){ overlay.style.display = 'none'; }, 400);
  }

  // -----------------------------------------------------------------
  // INFO PANEL LOGIC
  // -----------------------------------------------------------------
  var infoPanel   = document.getElementById('infoPanel');
  var panelTitle   = document.getElementById('panelTitle');
  var panelId      = document.getElementById('panelId');
  var panelLabel   = document.getElementById('panelLabel');
  var panelDetails = document.getElementById('panelDetails');
  var panelConns   = document.getElementById('panelConnections');
  var panelClose   = document.getElementById('panelClose');

  function stripHtml(html){
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return tmp.textContent || tmp.innerText || '';
  }

  function openPanelForNode(nodeId){
    var node = nodes.get(nodeId);
    if (!node) return;

    panelTitle.textContent = node.label || String(node.id);
    panelId.textContent = node.id;
    panelLabel.textContent = node.label || '(no label)';

    var rawTitle = node.title !== undefined && node.title !== null ? node.title : '(no docstring / details available)';
    panelDetails.textContent = stripHtml(rawTitle);

    // Connected nodes as badges
    panelConns.innerHTML = '';
    var connected = network.getConnectedNodes(nodeId);
    if (connected.length === 0) {
      var span = document.createElement('span');
      span.className = 'badge';
      span.textContent = 'No connections';
      panelConns.appendChild(span);
    } else {
      connected.slice(0, 25).forEach(function (cid) {
        var cnode = nodes.get(cid);
        var span = document.createElement('span');
        span.className = 'badge';
        span.textContent = (cnode && cnode.label) ? cnode.label : String(cid);
        panelConns.appendChild(span);
      });
      if (connected.length > 25) {
        var more = document.createElement('span');
        more.className = 'badge';
        more.textContent = '+' + (connected.length - 25) + ' more';
        panelConns.appendChild(more);
      }
    }

    infoPanel.classList.add('open');
  }

  function closePanel(){
    infoPanel.classList.remove('open');
  }

  var originalNodes = null;
  var originalEdges = null;

  function highlightNeighborhood(selectedNodeId) {
    if (!originalNodes) {
      originalNodes = nodes.get();
      originalEdges = edges.get();
    }

    var connectedNodes = network.getConnectedNodes(selectedNodeId);
    var allNodesToHighlight = new Set(connectedNodes);
    allNodesToHighlight.add(selectedNodeId);

    var updatedNodes = originalNodes.map(function(node) {
      if (allNodesToHighlight.has(node.id)) {
        return { id: node.id, opacity: 1.0 };
      } else {
        return { id: node.id, opacity: 0.15 };
      }
    });

    var updatedEdges = originalEdges.map(function(edge) {
      if (edge.from === selectedNodeId || edge.to === selectedNodeId) {
        return { id: edge.id, opacity: 0.9, width: 2.5 };
      } else {
        return { id: edge.id, opacity: 0.05 };
      }
    });

    nodes.update(updatedNodes);
    edges.update(updatedEdges);
  }

  function resetHighlighting() {
    if (originalNodes) {
      nodes.update(originalNodes.map(function(node) {
        return { id: node.id, opacity: 1.0 };
      }));
      edges.update(originalEdges.map(function(edge) {
        return { id: edge.id, opacity: 0.8, width: 1.4 };
      }));
      originalNodes = null;
      originalEdges = null;
    }
  }

  network.on('click', function (params) {
    if (params.nodes.length > 0) {
      var selectedNode = params.nodes[0];
      openPanelForNode(selectedNode);
      network.focus(selectedNode, {
        scale: 1.1,
        animation: { duration: 500, easingFunction: 'easeInOutQuad' }
      });
      highlightNeighborhood(selectedNode);
    } else {
      closePanel();
      resetHighlighting();
    }
  });

  panelClose.addEventListener('click', closePanel);

  // -----------------------------------------------------------------
  // HOVER GLOW EFFECT (extra visual polish)
  // -----------------------------------------------------------------
  network.on('hoverNode', function (params) {
    container.style.cursor = 'pointer';
    network.updateEditMode && null;
  });
  network.on('blurNode', function () {
    container.style.cursor = 'default';
  });

  // -----------------------------------------------------------------
  // TOOLBAR ACTIONS
  // -----------------------------------------------------------------
  var physicsEnabled = true;
  var physicsBtn = document.getElementById('physicsToggle');
  physicsBtn.classList.add('active');

  physicsBtn.addEventListener('click', function () {
    physicsEnabled = !physicsEnabled;
    network.setOptions({ physics: { enabled: physicsEnabled } });
    physicsBtn.classList.toggle('active', physicsEnabled);
  });

  document.getElementById('fitBtn').addEventListener('click', function () {
    network.fit({ animation: { duration: 700, easingFunction: 'easeInOutQuad' } });
  });

  // -----------------------------------------------------------------
  // SEARCH — focus + highlight matching node
  // -----------------------------------------------------------------
  var searchInput = document.getElementById('searchInput');
  var searchTimeout;

  searchInput.addEventListener('input', function (e) {
    clearTimeout(searchTimeout);
    var query = e.target.value.trim().toLowerCase();
    if (!query) return;

    searchTimeout = setTimeout(function () {
      var allNodes = nodes.get();
      var match = allNodes.find(function (n) {
        return (n.label && n.label.toLowerCase().includes(query)) ||
               (String(n.id).toLowerCase().includes(query));
      });

      if (match) {
        network.selectNodes([match.id]);
        network.focus(match.id, {
          scale: 1.2,
          animation: { duration: 600, easingFunction: 'easeInOutQuad' }
        });
        openPanelForNode(match.id);
      }
    }, 250);
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      searchInput.blur();
    }
  });

  // -----------------------------------------------------------------
  // RESPONSIVE RESIZE HANDLING
  // -----------------------------------------------------------------
  window.addEventListener('resize', function () {
    network.redraw();
  });
</script>

</body>
</html>
