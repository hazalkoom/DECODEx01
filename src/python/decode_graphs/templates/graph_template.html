<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Codebase Dependency Graph</title>

<!-- Vis.js Network -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/standalone/umd/vis-network.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/standalone/umd/vis-network.min.css" rel="stylesheet" type="text/css" />

<style>
  :root{
    --bg-0:#0a0e14;
    --bg-1:#0d1117;
    --panel-bg: rgba(22, 27, 38, 0.55);
    --panel-bg-solid: rgba(17, 21, 31, 0.92);
    --panel-border: rgba(255,255,255,0.08);
    --accent: #61dafb;
    --accent-2: #a78bfa;
    --accent-3: #34d399;
    --text-hi: #e6edf3;
    --text-lo: #8b949e;
    --danger: #f87171;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background: radial-gradient(circle at 20% 20%, #111827 0%, var(--bg-0) 45%, var(--bg-1) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-hi);
  }

  #mynetwork{
    position: fixed;
    top:0; left:0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    touch-action: none;
  }

  /* ---------- Top Toolbar ---------- */
  .toolbar{
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 25;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
  }

  .brand{
    pointer-events: auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 16px;
    border-radius: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .brand .dot{
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent);
    flex-shrink: 0;
  }

  .toolbar-actions{
    pointer-events: auto;
    display:flex;
    gap: 8px;
    flex-wrap: nowrap;
  }

  .tbtn{
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    color: var(--text-hi);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    transition: all .18s ease;
    white-space: nowrap;
    user-select: none;
  }
  .tbtn:hover{
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(97,218,251,0.25);
    transform: translateY(-1px);
  }
  .tbtn:active{ transform: translateY(0); }
  .tbtn.active{
    border-color: var(--accent-3);
    box-shadow: 0 0 0 1px var(--accent-3), 0 0 16px rgba(52,211,153,0.35);
  }

  /* ---------- Legend popover ---------- */
  .legend-wrap{ position: relative; }
  .legend-popover{
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 190px;
    background: var(--panel-bg-solid);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    border-radius: 14px;
    padding: 12px 14px;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: all .18s ease;
    z-index: 30;
  }
  .legend-popover.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .legend-title{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-lo);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap: 9px;
    font-size: 12.5px;
    padding: 4px 0;
    color: var(--text-hi);
  }
  .legend-row svg{ flex-shrink:0; }

  /* ---------- Search + Focus chip row ---------- */
  .left-controls{
    position: fixed;
    top: 68px;
    left: 16px;
    right: 16px;
    z-index: 20;
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items:center;
    pointer-events: none;
  }
  .left-controls > *{ pointer-events: auto; }

  #searchInput{
    width: 220px;
    max-width: 60vw;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    color: var(--text-hi);
    font-size: 13px;
    outline: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    transition: box-shadow .2s ease, width .2s ease;
  }
  #searchInput::placeholder{ color: var(--text-lo); }
  #searchInput:focus{
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(97,218,251,0.25);
  }

  .focus-chip{
    display: none;
    align-items:center;
    gap: 8px;
    padding: 9px 8px 9px 14px;
    border-radius: 999px;
    background: rgba(97,218,251,0.12);
    border: 1px solid rgba(97,218,251,0.4);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    max-width: min(360px, 60vw);
  }
  .focus-chip.show{ display:flex; }
  .focus-chip .fc-label{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .focus-chip .fc-clear{
    flex-shrink:0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(97,218,251,0.2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size: 12px;
    transition: background .15s ease;
  }
  .focus-chip .fc-clear:hover{ background: rgba(97,218,251,0.4); }

  /* ---------- Info / Detail Panel (Glassmorphism) ---------- */
  #infoPanel{
    position: fixed;
    z-index: 30;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px 22px;
    transition: transform .35s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    opacity: 0;
    pointer-events: none;
  }

  @media (min-width: 761px){
    #infoPanel{
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 340px;
      transform: translateX(360px);
      display:flex;
      flex-direction: column;
    }
    #infoPanel.open{
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
  }

  @media (max-width: 760px){
    #infoPanel{
      left: 10px;
      right: 10px;
      bottom: 10px;
      max-height: 50vh;
      transform: translateY(120%);
      border-radius: 20px;
    }
    #infoPanel.open{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .tbtn .label{ display:none; }
    .tbtn{ padding: 10px 11px; }
    .brand .label{ display:none; }
    #searchInput{ width: 46vw; }
  }

  .panel-header{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
    flex-shrink: 0;
  }

  .panel-title{
    font-size: 17px;
    font-weight: 700;
    color: var(--text-hi);
    word-break: break-word;
    line-height: 1.3;
  }

  .panel-close{
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    color: var(--text-lo);
    width: 28px; height: 28px;
    min-width: 28px;
    border-radius: 8px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
    line-height: 1;
    transition: all .15s ease;
  }
  .panel-close:hover{ color: var(--danger); border-color: var(--danger); }

  .panel-body{
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  .panel-body::-webkit-scrollbar{ width: 6px; }
  .panel-body::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius: 10px; }

  .field-label{
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 16px;
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field-label:first-child{ margin-top: 0; }
  .field-label::before{
    content:'';
    width: 6px; height: 6px;
    border-radius: 2px;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
  }

  .field-value{
    font-size: 13px;
    color: var(--text-hi);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    word-break: break-word;
    white-space: pre-wrap;
    line-height: 1.55;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  .field-value.id-value{ color: var(--accent-2); font-weight: 600; }

  .group-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
  }

  .badge-row{ display:flex; gap:6px; flex-wrap: wrap; margin-top: 4px; }
  .badge{
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(97,218,251,0.12);
    border: 1px solid rgba(97,218,251,0.35);
    color: var(--accent);
    font-weight: 600;
  }
  .badge-clickable{ cursor: pointer; transition: all .15s ease; }
  .badge-clickable:hover{
    background: rgba(97,218,251,0.28);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .placeholder-hint{
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 15;
    color: var(--text-lo);
    font-size: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    padding: 8px 14px;
    border-radius: 10px;
    pointer-events: none;
    animation: fadeOutHint 6s forwards;
  }
  @keyframes fadeOutHint{
    0%, 70%{ opacity: 1; }
    100%{ opacity: 0; visibility: hidden; }
  }
  @media (max-width: 760px){
    .placeholder-hint{ left: 10px; right: 10px; bottom: auto; top: 116px; text-align:center; }
  }

  /* Loading overlay */
  #loadingOverlay{
    position: fixed; inset:0; z-index: 50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: var(--bg-1);
    transition: opacity .4s ease, visibility .4s ease;
  }
  .spinner{
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #loadingOverlay p{ color: var(--text-lo); font-size: 13px; letter-spacing: 0.5px; }

  /* ---------- Native vis-network tooltip, restyled ---------- */
  div.vis-tooltip{
    background: var(--panel-bg-solid) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 12px !important;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5) !important;
    padding: 10px 12px !important;
    font-family: 'Inter', sans-serif !important;
    color: var(--text-hi) !important;
    white-space: normal !important;
    max-width: 300px !important;
    font-size: 12.5px !important;
    line-height: 1.5 !important;
    backdrop-filter: blur(10px);
  }
  .tt-head{ font-weight: 700; font-size: 13px; color: var(--text-hi); margin-bottom: 2px; word-break: break-word; }
  .tt-kind{ font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tt-body{ color: var(--text-lo); font-size: 12px; white-space: pre-wrap; }
</style>
</head>

<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>RENDERING DEPENDENCY GRAPH…</p>
</div>

<div class="toolbar">
  <div class="brand">
    <span class="dot"></span>
    <span class="label">Dependency Graph</span>
  </div>
  <div class="toolbar-actions">
    <div class="legend-wrap">
      <div class="tbtn" id="legendToggle" title="Show legend">🎨<span class="label"> Legend</span></div>
      <div class="legend-popover" id="legendPopover">
        <div class="legend-title">Node types</div>
        <div id="legendItems"></div>
      </div>
    </div>
    <div class="tbtn" id="layoutToggle" title="Switch layout">🌳<span class="label"> Tree</span></div>
    <div class="tbtn active" id="physicsToggle" title="Toggle physics simulation">⚛<span class="label"> Physics</span></div>
    <div class="tbtn" id="fitBtn" title="Fit graph to screen">⤢<span class="label"> Fit</span></div>
  </div>
</div>

<div class="left-controls">
  <input id="searchInput" type="text" placeholder="🔍 Search node…" autocomplete="off" />
  <div class="focus-chip" id="focusChip">
    <span class="fc-label" id="focusChipLabel">Focused</span>
    <span class="fc-clear" id="focusChipClear" title="Clear focus">✕</span>
  </div>
</div>

<div id="mynetwork"></div>

<div id="infoPanel">
  <div class="panel-header">
    <div class="panel-title" id="panelTitle">Node</div>
    <div class="panel-close" id="panelClose">✕</div>
  </div>
  <div class="panel-body">
    <div class="field-label">Type</div>
    <div id="panelGroup"><span class="group-badge">—</span></div>

    <div class="field-label">ID</div>
    <div class="field-value id-value" id="panelId">—</div>

    <div class="field-label">Label</div>
    <div class="field-value" id="panelLabel">—</div>

    <div class="field-label">Details / Docstring</div>
    <div class="field-value" id="panelDetails">—</div>

    <div class="field-label">Connections</div>
    <div class="badge-row" id="panelConnections"></div>
  </div>
</div>

<div class="placeholder-hint" id="placeholderHint">💡 Click a node to explore it · Double-click to expand further</div>

<script type="text/javascript">
  // -----------------------------------------------------------------
  // DATA INJECTED BY PYVIS (do not remove — required Jinja2 hooks)
  // -----------------------------------------------------------------
  var nodes = new vis.DataSet({{ nodes|safe }});
  var edges = new vis.DataSet({{ edges|safe }});

  var container = document.getElementById('mynetwork');
  var data = { nodes: nodes, edges: edges };

  // -----------------------------------------------------------------
  // VISUAL LANGUAGE — one style per semantic group produced by
  // graph_generator.py ('entry','file','external','symbol','class').
  // Unknown/future groups fall back to GROUP_STYLES.default.
  // -----------------------------------------------------------------
  var GROUP_STYLES = {
    entry:    { shape:'star',    color:'#fbbf24', border:'#f59e0b', font:'#fef3c7', glow:'rgba(251,191,36,0.6)',  label:'Entry point' },
    file:     { shape:'dot',     color:'#60a5fa', border:'#3b82f6', font:'#dbeafe', glow:'rgba(96,165,250,0.5)',  label:'Project file' },
    external: { shape:'dot',     color:'#64748b', border:'#475569', font:'#cbd5e1', glow:'rgba(100,116,139,0.35)',label:'External / stdlib', dashed:true },
    symbol:   { shape:'dot',     color:'#a78bfa', border:'#8b5cf6', font:'#ede9fe', glow:'rgba(167,139,250,0.5)', label:'Function / method' },
    class:    { shape:'diamond', color:'#34d399', border:'#10b981', font:'#d1fae5', glow:'rgba(52,211,153,0.5)',  label:'Class' },
    default:  { shape:'dot',     color:'#22d3ee', border:'#06b6d4', font:'#cffafe', glow:'rgba(34,211,238,0.5)',  label:'Node' }
  };
  function styleFor(group){ return GROUP_STYLES[group] || GROUP_STYLES.default; }

  // -----------------------------------------------------------------
  // SMALL HELPERS
  // -----------------------------------------------------------------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function stripHtml(html){
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return tmp.textContent || tmp.innerText || '';
  }
  function truncate(str, n){
    if (!str) return str;
    return str.length > n ? str.slice(0, n).trim() + '…' : str;
  }
  // Fully-qualified dotted paths (e.g. "pkg.module.thing") are hard to
  // read at a glance — show just the last segment on the canvas and
  // keep the full path available in the tooltip and side panel.
  function humanizeLabel(label){
    if (!label) return label;
    var dotCount = (label.match(/\./g) || []).length;
    if (dotCount >= 2) {
      var parts = label.split('.');
      return parts[parts.length - 1];
    }
    if (label.length > 24) {
      return label.slice(0, 14) + '…' + label.slice(-7);
    }
    return label;
  }
  function shapeSVG(shape, color){
    var c = color || '#61dafb';
    switch(shape){
      case 'star':
        return '<svg width="14" height="14" viewBox="0 0 24 24"><polygon points="12,2 14.9,9.1 22.5,9.4 16.5,14.3 18.6,21.6 12,17.3 5.4,21.6 7.5,14.3 1.5,9.4 9.1,9.1" fill="'+c+'"/></svg>';
      case 'diamond':
        return '<svg width="14" height="14" viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12" fill="'+c+'"/></svg>';
      case 'triangle':
        return '<svg width="14" height="14" viewBox="0 0 24 24"><polygon points="12,3 22,21 2,21" fill="'+c+'"/></svg>';
      case 'box': case 'square':
        return '<svg width="14" height="14" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="'+c+'"/></svg>';
      default:
        return '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="'+c+'"/></svg>';
    }
  }

  // -----------------------------------------------------------------
  // PREPROCESS NODES — shorten labels for the canvas, keep full name +
  // full docstring available for the tooltip / side panel.
  // -----------------------------------------------------------------
  function preprocessNodes(){
    var updates = nodes.getIds().map(function(id){
      var n = nodes.get(id);
      var fullLabel = n.label != null ? String(n.label) : String(n.id);
      var shortLabel = humanizeLabel(fullLabel);
      var style = styleFor(n.group);
      var rawTitle = n.title || '';
      var bodyText = truncate(stripHtml(rawTitle), 280);
      var newTitle =
        '<div class="tt-head">' + escapeHtml(fullLabel) + '</div>' +
        '<div class="tt-kind">' + escapeHtml(style.label) + '</div>' +
        (bodyText ? '<div class="tt-body">' + escapeHtml(bodyText) + '</div>' : '');
      return { id: id, label: shortLabel, fullLabel: fullLabel, fullDetails: rawTitle, title: newTitle };
    });
    nodes.update(updates);
  }

  // -----------------------------------------------------------------
  // GRAPH META — degree + adjacency, used for sizing and focus mode
  // -----------------------------------------------------------------
  var degree = new Map();
  var adjacency = new Map();
  var hubThreshold = 2;

  function computeGraphMeta(){
    nodes.getIds().forEach(function(id){
      degree.set(id, 0);
      adjacency.set(id, { neighbors: new Set(), edgeIds: new Set() });
    });
    edges.get().forEach(function(e){
      if (!adjacency.has(e.from) || !adjacency.has(e.to)) return;
      degree.set(e.from, (degree.get(e.from) || 0) + 1);
      degree.set(e.to, (degree.get(e.to) || 0) + 1);
      adjacency.get(e.from).neighbors.add(e.to);
      adjacency.get(e.from).edgeIds.add(e.id);
      adjacency.get(e.to).neighbors.add(e.from);
      adjacency.get(e.to).edgeIds.add(e.id);
    });
    var degVals = Array.from(degree.values());
    var avgDeg = degVals.reduce(function(a,b){ return a+b; }, 0) / (degVals.length || 1);
    hubThreshold = Math.max(2, Math.ceil(avgDeg));
  }

  // -----------------------------------------------------------------
  // STYLE STATES
  //   overview -> everything visible, labels only on hub/entry nodes
  //   focus    -> clicked node + neighbors lit up, everything else dim
  // -----------------------------------------------------------------
  function applyOverviewStyle(){
    var nodeUpdates = nodes.getIds().map(function(id){
      var n = nodes.get(id);
      var style = styleFor(n.group);
      var d = degree.get(id) || 0;
      var isEntry = n.group === 'entry';
      var showLabel = isEntry || d >= hubThreshold;
      return {
        id: id,
        shape: style.shape,
        color: {
          background: style.color,
          border: style.border,
          highlight: { background: style.color, border: '#ffffff' },
          hover: { background: style.color, border: '#ffffff' }
        },
        borderWidth: isEntry ? 3 : 2,
        opacity: 0.92,
        value: d + (isEntry ? 3 : 1),
        font: { size: showLabel ? 13 : 0, color: style.font, face: 'Inter, sans-serif', strokeWidth: 0 },
        shapeProperties: { borderDashes: style.dashed ? [4,3] : false },
        shadow: { enabled: isEntry, color: style.glow, size: 14, x: 0, y: 0 }
      };
    });
    nodes.update(nodeUpdates);

    var edgeUpdates = edges.get().map(function(e){
      return {
        id: e.id,
        color: { color: 'rgba(148,163,184,0.38)', highlight: '#61dafb', hover: '#7ee3ff', opacity: 1, inherit: false },
        width: 1.3
      };
    });
    edges.update(edgeUpdates);
  }

  var currentFocus = null;

  function enterFocus(nodeId, opts){
    opts = opts || {};
    var info = adjacency.get(nodeId);
    if (!info) return;
    var focusSet = new Set(info.neighbors);
    focusSet.add(nodeId);
    if (opts.twoHop){
      info.neighbors.forEach(function(nb){
        var nbInfo = adjacency.get(nb);
        if (nbInfo) nbInfo.neighbors.forEach(function(x){ focusSet.add(x); });
      });
    }

    var nodeUpdates = nodes.getIds().map(function(id){
      var n = nodes.get(id);
      var style = styleFor(n.group);
      var inFocus = focusSet.has(id);
      var isCenter = id === nodeId;
      return {
        id: id,
        opacity: inFocus ? 1 : 0.08,
        borderWidth: isCenter ? 4 : (inFocus ? 2.5 : 1),
        font: { size: inFocus ? 13 : 0, color: style.font, face: 'Inter, sans-serif', strokeWidth: 0 },
        shadow: inFocus
          ? { enabled: true, color: isCenter ? style.glow : 'rgba(97,218,251,0.3)', size: isCenter ? 22 : 10, x: 0, y: 0 }
          : { enabled: false }
      };
    });
    nodes.update(nodeUpdates);

    var edgeUpdates = edges.get().map(function(e){
      var active = focusSet.has(e.from) && focusSet.has(e.to);
      return {
        id: e.id,
        color: active
          ? { color: '#61dafb', opacity: 0.95, highlight: '#61dafb', hover: '#7ee3ff', inherit: false }
          : { color: 'rgba(51,65,85,0.5)', opacity: 0.05, inherit: false },
        width: active ? 2.2 : 1
      };
    });
    edges.update(edgeUpdates);

    network.fit({ nodes: Array.from(focusSet), animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    currentFocus = nodeId;
    updateFocusChip();
  }

  function clearFocus(){
    if (currentFocus === null) return;
    applyOverviewStyle();
    currentFocus = null;
    updateFocusChip();
    network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    clampZoom(550);
  }

  function updateFocusChip(){
    var chip = document.getElementById('focusChip');
    var label = document.getElementById('focusChipLabel');
    if (currentFocus !== null){
      var n = nodes.get(currentFocus);
      label.textContent = 'Focused: ' + (n ? (n.fullLabel || n.label) : currentFocus);
      chip.classList.add('show');
    } else {
      chip.classList.remove('show');
    }
  }

  function clampZoom(delay){
    setTimeout(function(){
      var scale = network.getScale();
      if (scale < 0.6) network.moveTo({ scale: 0.6, animation: { duration: 250 } });
      else if (scale > 1.7) network.moveTo({ scale: 1.7, animation: { duration: 250 } });
    }, delay || 0);
  }

  // -----------------------------------------------------------------
  // LAYOUT — hierarchical by default. Direction follows the natural
  // flow of the data (importer -> import, caller -> callee,
  // parent -> child), which reads top-to-bottom / left-to-right.
  // A "Force" mode is offered as an organic alternative.
  // -----------------------------------------------------------------
  var currentLayout = 'hierarchical';

  function getLayoutPhysicsOptions(mode){
    var narrow = window.innerWidth < 761;
    if (mode === 'hierarchical'){
      return {
        layout: {
          hierarchical: {
            enabled: true,
            direction: narrow ? 'UD' : 'LR',
            sortMethod: 'directed',
            levelSeparation: narrow ? 120 : 170,
            nodeSpacing: 100,
            treeSpacing: 150,
            blockShifting: true,
            edgeMinimization: true,
            parentCentralization: true
          }
        },
        physics: {
          enabled: true,
          solver: 'hierarchicalRepulsion',
          hierarchicalRepulsion: { nodeDistance: 130, centralGravity: 0, springLength: 130, springConstant: 0.03, damping: 0.5, avoidOverlap: 0.7 },
          stabilization: { enabled: true, iterations: 200, updateInterval: 25 }
        }
      };
    }
    return {
      layout: { hierarchical: { enabled: false }, improvedLayout: true, randomSeed: 42 },
      physics: {
        enabled: true,
        solver: 'barnesHut',
        barnesHut: { gravitationalConstant: -16000, centralGravity: 0.3, springLength: 150, springConstant: 0.04, damping: 0.45, avoidOverlap: 0.8 },
        stabilization: { enabled: true, iterations: 250, updateInterval: 25 }
      }
    };
  }

  // -----------------------------------------------------------------
  // BASE OPTIONS
  // -----------------------------------------------------------------
  var options = {
    autoResize: true,
    height: '100%',
    width: '100%',
    nodes: {
      borderWidthSelected: 4,
      scaling: { min: 14, max: 42, label: { enabled: false } },
      shadow: { enabled: false },
      chosen: true
    },
    edges: {
      smooth: { enabled: true, type: 'continuous', roundness: 0.55 },
      arrows: { to: { enabled: true, scaleFactor: 0.55, type: 'arrow' } },
      font: { color: '#8b949e', size: 10, strokeWidth: 0, align: 'top', background: 'rgba(13,17,23,0.75)' },
      selectionWidth: 1.5,
      hoverWidth: 1.2
    },
    interaction: {
      hover: true,
      tooltipDelay: 120,
      hideEdgesOnDrag: true,
      hideEdgesOnZoom: false,
      navigationButtons: false,
      keyboard: { enabled: true, bindToWindow: false },
      multiselect: false,
      zoomView: true,
      dragView: true
    }
  };
  var initialLayoutOpts = getLayoutPhysicsOptions('hierarchical');
  options.layout = initialLayoutOpts.layout;
  options.physics = initialLayoutOpts.physics;

  // -----------------------------------------------------------------
  // BUILD
  // -----------------------------------------------------------------
  preprocessNodes();
  computeGraphMeta();
  applyOverviewStyle();

  var network = new vis.Network(container, data, options);

  // -----------------------------------------------------------------
  // LEGEND
  // -----------------------------------------------------------------
  function buildLegend(){
    var groupsPresent = new Set();
    nodes.get().forEach(function(n){ groupsPresent.add(n.group || 'default'); });
    var container = document.getElementById('legendItems');
    container.innerHTML = '';
    groupsPresent.forEach(function(g){
      var style = styleFor(g);
      var row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = shapeSVG(style.shape, style.color) + '<span>' + escapeHtml(style.label) + '</span>';
      container.appendChild(row);
    });
  }
  buildLegend();

  // -----------------------------------------------------------------
  // LOADING OVERLAY — hide once physics stabilizes, and clamp zoom
  // so the graph doesn't land too small on screen.
  // -----------------------------------------------------------------
  var loadingDone = false;
  function finishLoading(){
    if (loadingDone) return;
    loadingDone = true;
    var overlay = document.getElementById('loadingOverlay');
    overlay.style.opacity = '0';
    overlay.style.visibility = 'hidden';
    setTimeout(function(){ overlay.style.display = 'none'; }, 400);
  }
  network.once('stabilizationIterationsDone', function(){
    network.fit({ animation: false });
    var scale = network.getScale();
    if (scale < 0.6) network.moveTo({ scale: 0.6 });
    else if (scale > 1.7) network.moveTo({ scale: 1.7 });
    finishLoading();
  });
  setTimeout(finishLoading, 4000);

  // -----------------------------------------------------------------
  // INFO PANEL LOGIC
  // -----------------------------------------------------------------
  var infoPanel    = document.getElementById('infoPanel');
  var panelTitle   = document.getElementById('panelTitle');
  var panelGroup   = document.getElementById('panelGroup');
  var panelId      = document.getElementById('panelId');
  var panelLabel   = document.getElementById('panelLabel');
  var panelDetails = document.getElementById('panelDetails');
  var panelConns   = document.getElementById('panelConnections');
  var panelClose   = document.getElementById('panelClose');

  function openPanelForNode(nodeId){
    var node = nodes.get(nodeId);
    if (!node) return;
    var style = styleFor(node.group);
    var displayName = node.fullLabel || node.label || String(node.id);

    panelTitle.textContent = displayName;
    panelGroup.innerHTML = '<span class="group-badge" style="background:' + style.color + '22; color:' + style.color + '; border:1px solid ' + style.color + '55;">' +
      shapeSVG(style.shape, style.color) + ' ' + escapeHtml(style.label) + '</span>';
    panelId.textContent = node.id;
    panelLabel.textContent = displayName;

    var rawDetails = (node.fullDetails !== undefined && node.fullDetails !== null && node.fullDetails !== '')
      ? node.fullDetails
      : '(no docstring / details available)';
    panelDetails.textContent = stripHtml(rawDetails);

    panelConns.innerHTML = '';
    var connected = network.getConnectedNodes(nodeId);
    if (connected.length === 0) {
      var span = document.createElement('span');
      span.className = 'badge';
      span.textContent = 'No connections';
      panelConns.appendChild(span);
    } else {
      connected.slice(0, 25).forEach(function (cid) {
        var cnode = nodes.get(cid);
        var span = document.createElement('span');
        span.className = 'badge badge-clickable';
        span.textContent = cnode ? (cnode.fullLabel || cnode.label) : String(cid);
        span.title = 'Click to focus this node';
        span.addEventListener('click', function(){
          network.selectNodes([cid]);
          enterFocus(cid);
          openPanelForNode(cid);
        });
        panelConns.appendChild(span);
      });
      if (connected.length > 25) {
        var more = document.createElement('span');
        more.className = 'badge';
        more.textContent = '+' + (connected.length - 25) + ' more';
        panelConns.appendChild(more);
      }
    }

    infoPanel.classList.add('open');
  }

  function closePanel(){
    infoPanel.classList.remove('open');
  }

  panelClose.addEventListener('click', closePanel);

  // -----------------------------------------------------------------
  // CLICK / DOUBLE-CLICK — the core "click to reveal more" interaction
  // -----------------------------------------------------------------
  network.on('click', function (params) {
    if (params.nodes.length > 0) {
      var id = params.nodes[0];
      enterFocus(id);
      openPanelForNode(id);
    } else if (params.edges.length > 0) {
      var e = edges.get(params.edges[0]);
      enterFocus(e.from);
      openPanelForNode(e.from);
    } else {
      clearFocus();
      closePanel();
    }
  });

  network.on('doubleClick', function (params) {
    if (params.nodes.length > 0) {
      var id = params.nodes[0];
      enterFocus(id, { twoHop: true });
      openPanelForNode(id);
    }
  });

  // Subtle hover emphasis on desktop, skipped while a focus is active
  // so it doesn't fight the dim/highlight state.
  var hoveredOriginal = null;
  network.on('hoverNode', function (params) {
    container.style.cursor = 'pointer';
    if (currentFocus !== null) return;
    var n = nodes.get(params.node);
    hoveredOriginal = { id: params.node, borderWidth: n.borderWidth };
    nodes.update({ id: params.node, borderWidth: (n.borderWidth || 2) + 2 });
  });
  network.on('blurNode', function () {
    container.style.cursor = 'default';
    if (hoveredOriginal) {
      nodes.update({ id: hoveredOriginal.id, borderWidth: hoveredOriginal.borderWidth });
      hoveredOriginal = null;
    }
  });

  // -----------------------------------------------------------------
  // TOOLBAR ACTIONS
  // -----------------------------------------------------------------
  var physicsEnabled = true;
  var physicsBtn = document.getElementById('physicsToggle');

  physicsBtn.addEventListener('click', function () {
    physicsEnabled = !physicsEnabled;
    network.setOptions({ physics: { enabled: physicsEnabled } });
    physicsBtn.classList.toggle('active', physicsEnabled);
  });

  document.getElementById('fitBtn').addEventListener('click', function () {
    if (currentFocus !== null) {
      var info = adjacency.get(currentFocus);
      var set = info ? Array.from(info.neighbors).concat([currentFocus]) : undefined;
      network.fit({ nodes: set, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    } else {
      network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    }
    clampZoom(650);
  });

  var layoutBtn = document.getElementById('layoutToggle');
  function setLayoutButtonLabel(){
    layoutBtn.innerHTML = currentLayout === 'hierarchical'
      ? '🌳<span class="label"> Tree</span>'
      : '🌐<span class="label"> Force</span>';
  }
  function applyLayout(mode){
    currentLayout = mode;
    network.setOptions(getLayoutPhysicsOptions(mode));
    network.once('stabilizationIterationsDone', function(){
      network.fit({ animation: { duration: 400 } });
      clampZoom(450);
    });
  }
  layoutBtn.addEventListener('click', function () {
    applyLayout(currentLayout === 'hierarchical' ? 'force' : 'hierarchical');
    setLayoutButtonLabel();
  });

  // Legend popover toggle
  var legendWrap = document.querySelector('.legend-wrap');
  var legendPopover = document.getElementById('legendPopover');
  document.getElementById('legendToggle').addEventListener('click', function (e) {
    e.stopPropagation();
    legendPopover.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (!legendWrap.contains(e.target)) legendPopover.classList.remove('open');
  });

  // Focus chip clear button
  document.getElementById('focusChipClear').addEventListener('click', function(){
    clearFocus();
    closePanel();
  });

  // -----------------------------------------------------------------
  // SEARCH — finds by full name or id, then enters focus mode on it
  // -----------------------------------------------------------------
  var searchInput = document.getElementById('searchInput');
  var searchTimeout;

  searchInput.addEventListener('input', function (e) {
    clearTimeout(searchTimeout);
    var query = e.target.value.trim().toLowerCase();
    if (!query) return;

    searchTimeout = setTimeout(function () {
      var allNodes = nodes.get();
      var match = allNodes.find(function (n) {
        var hay = ((n.fullLabel || n.label || '') + ' ' + String(n.id)).toLowerCase();
        return hay.includes(query);
      });

      if (match) {
        network.selectNodes([match.id]);
        enterFocus(match.id);
        openPanelForNode(match.id);
      }
    }, 250);
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      searchInput.blur();
      clearFocus();
      closePanel();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.activeElement !== searchInput) {
      legendPopover.classList.remove('open');
      closePanel();
      clearFocus();
    }
  });

  // -----------------------------------------------------------------
  // RESPONSIVE RESIZE HANDLING
  // -----------------------------------------------------------------
  window.addEventListener('resize', function () {
    network.redraw();
  });
</script>

</body>
</html>
